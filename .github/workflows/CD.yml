name: CD

on: 
    workflow_run:
        workflows: ['CI']
        types: [completed]
        branches:
          -'advanced'

jobs:
  deploy: 
    if: github.events.workflow_run.conclusion == 'success'
    runs-on: self-hosted
    steps:
      - name: code checkout
        uses: action/checkout@v7

      - name: copy example env to main env
        run: cp .env.example .env

      - name: Docker Setup [Login]
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Deploy the containers with Docker compose
        run: 
          docker compose pull 
          docker compose up -d


