# Goal - Ensure the docker files and Docker images are security tested 

name: dcoekr scan

on: 
  workflow_call

jobs:
  docker-file-lint-and-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folder: [backend, frontend]
        
    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: ${{ matrix.folder }}/Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with: 
         dockerfile: ${{ matrix.folder }}/Dockerfile

      - name: Docker setup [login]
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker build ${{ matrix.folder }}
        run: docker build -t ${{vars.DOCKER_USERNAME}}/devboard-${{ matrix.folder }}:latest .
        working-directory: ${{ matrix.folder }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{vars.DOCKER_USERNAME}}/devboard-${{ matrix.folder }}:latest .
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
         
  