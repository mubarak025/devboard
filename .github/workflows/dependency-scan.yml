# Goal - I have to ensure the packages & dependecies have been audited for security vulnerabilities

name: dependency scan

on:
  workflow_call:

jobs:
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v7
      
      - name: setup Go
        uses: actions/setup-go@v6
        with: 
          go-version: 1.22
          go-version-file: 'go.mod'
          cache-dependency-path: go.sum
          
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: govulncheck
        continue-on-error: true
        run: govulncheck ./...  > govulncheck-report.txt
        working-directory: backend
      
     

      - name: setup node
        uses: actions/setup-node@v6
        with: 
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: run dependency  scan for node
        run: npm audit
        working-directory: frontend

      - name: Upload  Report to artifact
        uses: actions/upload-artifact@v4
        if: always() # Ensures reports upload even if tests fail
        with:
          name: dependency-scan-report # Name of the zip package
          path: reports/dependency-scan-report.txt # Path to your file or folder
          retention-days: 5 # Optional: default is 90 days

      
